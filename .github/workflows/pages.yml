name: Publicar site S21

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - images/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s21-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Preparar somente os arquivos públicos do site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets _site/images
          cp index.html _site/
          cp -R assets/. _site/assets/
          find images -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.svg' -o -iname '*.gif' \) -exec cp {} _site/images/ \;
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/style.css
          test -s _site/assets/script.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
